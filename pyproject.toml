[project]
name = "memgit"
version = "0.1.0"
description = "Version control and time-travel debugging for AI agent memory"
authors = [
    { name = "Sebastian Cheung", email = "sebcheung64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.69.0",
]
mcp = [
    "mcp>=2.1,<3",
]
web = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.34",
]

[project.scripts]
memgit = "memgit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "memgit"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
    "live: hits the real Anthropic API; needs ANTHROPIC_API_KEY and `--all-extras`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# `ruff format` is deliberately not adopted alongside this: reformatting the
# whole tree now would blow away `git blame` across every file for zero
# behavior change. E501 is off because nothing here wraps long lines for us.
# D105/D107 are off because a dunder's contract is its name (`__len__` needs
# no docstring saying "return the length") and a dataclass `__init__` is
# already documented by its class docstring.
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF", "D"]
ignore = ["D203", "D213", "E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "ANN", "PLR2004", "E402"]
"src/memgit/cli.py" = ["B008"]
