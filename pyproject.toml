[project]
name = "memgit"
version = "0.1.0"
description = "Version control and time-travel debugging for AI agent memory"
authors = [
    { name = "Sebastian Cheung", email = "sebcheung64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.69.0",
]
mcp = [
    "mcp>=2.1,<3",
]
web = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.34",
]

[project.scripts]
memgit = "memgit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "memgit"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
    "live: hits the real Anthropic API; needs ANTHROPIC_API_KEY and `--all-extras`",
]
