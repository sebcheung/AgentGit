[project]
name = "memgit"
version = "0.1.0"
description = "Version control and time-travel debugging for AI agent memory"
authors = [
    { name = "Sebastian Cheung", email = "sebcheung64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.69.0",
]
mcp = [
    "mcp>=2.1,<3",
]
web = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.34",
]

[project.scripts]
memgit = "memgit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "memgit"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
    "live: hits the real Anthropic API; needs ANTHROPIC_API_KEY and `--all-extras`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# `ruff format` is deliberately not adopted alongside this: reformatting the
# whole tree now would blow away `git blame` across every file for zero
# behavior change. E501 is off because nothing here wraps long lines for us.
# D105/D107 are off because a dunder's contract is its name (`__len__` needs
# no docstring saying "return the length") and a dataclass `__init__` is
# already documented by its class docstring. D417 is off because this
# codebase's own convention (see e.g. `refs.py`'s `write_ref`) is to document
# only the non-obvious parameters in an Args: section, not pad it out with
# entries whose name already says everything -- exactly the "only comment on
# the non-obvious" rule the rest of the code follows.
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF", "D"]
ignore = ["D203", "D213", "E501", "D105", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "ANN", "PLR2004", "E402"]
"src/memgit/cli.py" = ["B008"]
# FastAPI's `Depends(...)` in a parameter default is the framework's own
# injection mechanism, the same "a default IS the API" case as cli.py's
# typer.Option() above.
"src/memgit/api/*.py" = ["B008"]
# models.py's own module docstring states the convention directly: a model
# gets a docstring only when there is something non-obvious to say about its
# shape, not one echoing field names back as prose.
"src/memgit/api/models.py" = ["D101"]

[tool.mypy]
python_version = "3.12"
files = ["src/memgit"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true

# Every package starts ignored; each is flipped on in its own commit as it's
# made to pass, so CI stays green at every point in that sequence rather than
# going red for the length of the whole pass. tests/ is out of `files`
# entirely, not just ignored here -- see the "Decisions locked in" row this
# slice adds to PLAN.md for why.
[[tool.mypy.overrides]]
module = "memgit.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["memgit.core.*", "memgit.retrieval.*"]
ignore_errors = false
strict_equality = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["mcp.*", "anthropic.*", "uvicorn.*"]
ignore_missing_imports = true
